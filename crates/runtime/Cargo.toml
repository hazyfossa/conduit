[package]
name = "conduit-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
conduit-common = { version = "0.1.0", path = "../common" }
const-random = "0.1.18"
eyre = "0.6.14"
fjall = { version = "3.1.13", default-features = false }
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
typetag = "0.2.23"
winwin = { version = "0.1.0", path = "../../../winwin", features = ["blob", "lock-aspect-ratio", "messagebox", "tracing-layer"] }
wry = { version = "0.57.2", features = ["tracing"] }
